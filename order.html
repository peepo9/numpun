<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันคำสั่งซื้อ — FreshSqueeze</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อน้ำผลไม้ FreshSqueeze">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="navbar__logo">FreshSqueeze</a>
      <nav class="navbar__links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
      <a href="product.html" class="btn btn--secondary btn--sm">เลือกสินค้าต่อ</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-heading" style="margin-inline:auto; text-align:center;">
          <h1 class="heading-accent" style="margin-inline:auto;">ยืนยันคำสั่งซื้อ</h1>
          <p class="text-lead">กรอกข้อมูลให้ครบถ้วน ทีมงานจะติดต่อกลับเพื่อยืนยันและนัดจัดส่ง</p>
        </div>

        <form id="orderForm" class="form-card">
          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line ID</label>
            <input type="text" id="contact" name="contact" placeholder="เช่น 0812345678 หรือ @freshsqueeze" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" readonly>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" readonly>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง หรือความต้องการเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <button type="submit" class="btn btn--primary form-submit">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span class="footer__brand">FreshSqueeze</span>
      <nav class="footer__links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
      <span class="text-sm text-muted">© 2026 FreshSqueeze. สดชื่นทุกวันจากธรรมชาติ</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
